name: Build Windows Injector
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        run: |
          cl /EHsc /D_WIN32_WINNT=0x0600 /I. injector.cpp /link kernel32.lib ntdll.lib /Fe:injector.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: injector
          path: injector.exe
